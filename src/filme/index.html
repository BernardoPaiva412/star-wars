<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="film-page-title">Carregando...</title>
    <link rel="icon" href="/assets/icons/fav.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
</head>

<body class="bg-gunmetal-dark text-beskar-silver font-exo2 flex flex-col min-h-screen">

    <!-- Header (Igual ao Index) -->
    <header class="bg-leather-brown shadow-lg z-50">
        <div class="max-w-7xl mx-auto px-7 py-3 flex items-center justify-between">
            <a href="/index.html">
                <img src="/assets/icons/home.png" alt="logo" class="h-13 hover:opacity-80 transition-opacity">
            </a>
            <a href="/index.html"
                class="text-rust font-orbitron hover:text-white transition-colors flex items-center gap-2">
                <i class="ph-fill ph-arrow-left"></i> Voltar
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="">
        <div id="movie-container" class="max-w-7xl mx-auto p-6">

            <template id="movie-template">
                <!-- Seção Superior: Capa e Informações -->
                <div class="flex flex-col md:flex-row gap-8 mb-12 animate-fade-in">

                    <!-- Coluna da Esquerda: Capa -->
                    <div class="w-full md:w-1/3 lg:w-1/4">
                        <div
                            class="rounded-lg overflow-hidden shadow-2xl border border-beskar-silver/20 relative group">
                            <img src="" alt="" class="movie-cover w-full h-auto object-cover block">
                            <div class="absolute inset-0 from-black/80 to-transparent opacity-60">
                            </div>
                        </div>
                    </div>

                    <!-- Coluna da Direita: Detalhes -->
                    <div class="w-full md:w-2/3 lg:w-3/4 flex flex-col justify-center">

                        <h1
                            class="movie-title font-orbitron text-4xl md:text-5xl text-title-yellow mb-2 font-bold tracking-wide uppercase leading-tight">
                        </h1>
                        <h2 class="movie-original-title text-xl text-beskar-silver/70 italic mb-6 font-light"></h2>

                        <!-- Grid de Metadados -->
                        <div
                            class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 bg-leather-brown/30 p-4 rounded-lg border border-beskar-silver/10">
                            <div>
                                <span class="block text-rust font-orbitron text-sm uppercase mb-1">Duração</span>
                                <span class="movie-duration text-white font-bold"></span>
                            </div>
                            <div>
                                <span class="block text-rust font-orbitron text-sm uppercase mb-1">Lançamento</span>
                                <span class="movie-release-date text-white font-bold"></span>
                            </div>
                            <div>
                                <span class="block text-rust font-orbitron text-sm uppercase mb-1">Classificação</span>
                                <span class="movie-content-rating text-white font-bold"></span>
                            </div>
                            <div>
                                <span class="block text-rust font-orbitron text-sm uppercase mb-1">Gênero</span>
                                <span class="movie-genres text-white font-bold"></span>
                            </div>
                        </div>

                        <!-- Sinopse -->
                        <div class="mb-8">
                            <h3 class="text-2xl font-orbitron text-rust mb-3 border-b border-beskar-silver/20 pb-2">
                                Sinopse</h3>
                            <p class="movie-synopsis text-lg leading-relaxed text-rebel-white/90 text-justify"></p>
                        </div>

                        <!-- Equipe -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <h4 class="text-rust font-orbitron mb-2">Direção</h4>
                                <p class="movie-directors text-beskar-silver"></p>
                            </div>
                            <div>
                                <h4 class="text-rust font-orbitron mb-2">Elenco Principal</h4>
                                <p class="movie-cast text-beskar-silver"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Seção Inferior: Galeria -->
                <div class="mt-12">
                    <h3 class="text-3xl font-orbitron text-title-yellow mb-6 border-l-4 border-rust pl-4">Galeria de
                        Cenas</h3>
                    <div class="movie-gallery grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <!-- Imagens injetadas via JS -->
                    </div>
                </div>
            </template>

        </div>
    </main>

    <!-- Footer (Igual ao Index) -->
    <footer class="mt-auto">
        <div class="bg-leather-brown">
            <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-1 lg:grid-cols-3 gap-6 p-6">
                <div>
                    <h3 class="font-semibold text-2xl mb-4 font-orbitron text-white">Redes Sociais</h3>
                    <ul class="text-rust font-exo2 space-y-2 text-lg">
                        <li><a href="#" class="hover:text-title-yellow transition"><i
                                    class="ph-fill ph-facebook-logo"></i> Facebook</a></li>
                        <li><a href="#" class="hover:text-title-yellow transition"><i
                                    class="ph-fill ph-instagram-logo"></i> Instagram</a></li>
                        <li><a href="#" class="hover:text-title-yellow transition"><i
                                    class="ph-fill ph-youtube-logo"></i> YouTube</a></li>
                        <li><a href="#" class="hover:text-title-yellow transition"><i
                                    class="ph-fill ph-twitter-logo"></i> Twitter</a></li>
                    </ul>
                </div>
                <div>
                    <h3 class="font-semibold text-2xl mb-4 font-orbitron text-white">Endereço</h3>
                    <address class="text-rust font-exo2 not-italic text-lg">
                        Av. Padawan, 501, Sala 1138<br>
                        Empresarial 66 da Ordem<br>
                        Rio de Coruscant - RC<br>
                        11266-025
                    </address>
                </div>
                <div>
                    <h3 class="font-semibold text-2xl mb-4 font-orbitron text-white">Contato</h3>
                    <p class="text-rust font-exo2 text-lg font-bold">(21) 97912-7874</p>
                </div>
            </div>
        </div>
        <div class="bg-muted-olive">
            <div class="max-w-7xl mx-auto p-4 text-center">
                <p class="font-light text-sm text-rebel-white font-exo2">&copy; 2025 Site do Boba. Que a força esteja
                    com você.</p>
            </div>
        </div>
    </footer>

    <script src="/js/movie-details.js" type="module"></script>
</body>

</html>
